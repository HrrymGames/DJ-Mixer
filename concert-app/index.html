<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Setlistic</title>
  <meta name="description" content="Keep every concert you've been to as a digital ticket, with your videos, photos and setlist.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Setlistic">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=3">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=3">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint so there is no light flash in dark mode.
    try {
      var t = JSON.parse(localStorage.getItem('stubs.settings') || '{}').theme || 'system';
      var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
</head>
<body>
  <div id="app">
    <main id="views">
      <section class="view" id="view-map" data-tab="map" hidden></section>
      <section class="view scroll" id="view-tickets" data-tab="tickets" hidden></section>
      <section class="view" id="view-featured" data-tab="featured" hidden></section>
      <section class="view scroll" id="view-wrapped" data-tab="wrapped" hidden></section>
      <section class="view scroll" id="view-wishlist" data-tab="wishlist" hidden></section>
      <section class="view scroll" id="view-settings" data-tab="settings" hidden></section>
      <section class="view scroll" id="view-detail" hidden></section>
    </main>

        <span>Wishlist</span>
      </button>

    </nav>

    <div id="layer"></div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>

</html>
